[project]
name = "lgs-tool-bot"
version = "0.1.0"
description = "A OneBot protocol compatible chat bot"
readme = "README.md"
license = "MIT"

requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3",
    "websockets>=13.0,<14",
    "httpx>=0.27,<1",
    "cairosvg>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
lgs-tool-bot = "lgs_tool_bot.__main__:main"
